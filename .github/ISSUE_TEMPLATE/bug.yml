name: Bug report
description: Something in councilkit does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest steps or commands that show the problem. Use synthetic data only.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `node --version` and `claude --version`, plus your operating system.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output
      description: Relevant command output. Remove any secrets or private paths first.
      render: text
